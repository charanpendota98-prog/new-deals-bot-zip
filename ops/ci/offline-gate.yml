# Offline regression gate — the same command an operator runs, on every push and
# pull request.
#
# SHIPPED HERE, INSTALLED THERE. GitHub only reads workflows from
# .github/workflows/, but that path cannot be pushed by a GitHub App token
# without the `workflows` permission. So this file is the source of truth (it is
# hash-verified in README's proof table) and is installed with:
#
#     ./ops/install_ci_workflow.sh          # copy into .github/workflows/
#     ./ops/install_ci_workflow.sh --print  # or paste it via the GitHub web UI
#
# test_repo_consistency.py fails if this file loses the gate, the jsdom install
# or the clean-checkout assertion, and fails if an installed copy drifts from it.
#
# It needs no Telegram session, no WhatsApp pairing, no EarnKaro/Affiliaters key
# and no database: ops/test_all.sh points every state path at a private temp dir
# before importing anything. That is why this workflow reads no secrets at all.
# If a future step ever needs a credential, the step belongs in a separate,
# manually dispatched workflow — never in the gate that runs on every PR.
#
# The gate also verifies README against itself (documented SHA-256 hashes, the
# bot's version label, and per-suite check counts taken from the run's own log),
# so the documentation cannot drift while the build stays green. Fix drift with:
#   python3 ops/doc_freshness.py --write
name: offline gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gate:
    name: Offline regression gate (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHON: python
      # The three jsdom suites resolve jsdom from here. jsdom is deliberately
      # NOT a dependency of the deployed bridge, so CI installs it into its own
      # prefix instead of inflating a production npm install.
      JSDOM_PREFIX: /tmp/category-ui-test
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bestgaa/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # pyflakes turns on the gate's lint step; without it the step skips.
          python -m pip install -r bestgaa/requirements.txt pyflakes

      - name: Install WhatsApp bridge dependencies
        run: npm install --prefix tg-wa-bridge --no-package-lock --ignore-scripts

      - name: Install jsdom for the dashboard DOM suites
        run: npm install --prefix "$JSDOM_PREFIX" --no-package-lock jsdom

      - name: Prove the bridge and rules files are still byte-identical
        run: |
          cmp bestgaa/category_rules.json tg-wa-bridge/category_rules.json
          cmp bestgaa/hypd_policy.py tg-wa-bridge/hypd_policy.py
          echo "shared taxonomy and HYPD policy are in parity"

      - name: Run the offline regression gate
        run: ./ops/test_all.sh

      - name: Assert the gate left no artifacts in the checkout
        run: |
          # The gate redirects BOT_DB_PATH / BOT_LOG_DIR / BOT_MEDIA_DIR into a
          # temp dir on purpose: a checkout full of test logs once made
          # conversion_report describe a build that was not live (2026-10-04).
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::the offline gate wrote into the checkout"
            echo "$dirty"
            exit 1
          fi
          echo "the checkout is clean: no test artifacts were committed or left behind"

      - name: Summarise documentation freshness
        if: always()
        run: |
          # Written outside the checkout on purpose (see the artifact assertion).
          report_path="${RUNNER_TEMP:-/tmp}/doc-freshness.json"
          python ops/doc_freshness.py --check --json > "$report_path" || true
          REPORT_PATH="$report_path" python - <<'PY'
          import json, os, pathlib
          report = json.loads(pathlib.Path(os.environ["REPORT_PATH"]).read_text())
          print(f"tracked files : {report['files_tracked']}")
          print(f"hashes checked: {report['hashes_verified']}")
          errors = [f for f in report["findings"] if f["severity"] == "error"]
          print(f"doc findings  : {len(errors)}")
          for finding in errors[:20]:
              print(f"  - [{finding['check']}] {finding.get('path', '')}: {finding['detail']}")
          PY
